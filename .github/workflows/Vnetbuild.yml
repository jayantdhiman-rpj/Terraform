name: Terraform - Create Azure Network

on:
  workflow_dispatch:
    inputs:

      resource_group_name:
        description: "Resource Group Name"
        required: true
        type: string

      
      vnet_name:
        description: "VNet Name"
        required: true
        type: string

      vnet_address_space:
        description: "VNet Address Space - example: 10.10.0.0/16"
        required: true
        type: string

      subnet_name:
        description: "Subnet Name"
        required: true
        type: string

      subnet_address_prefix:
        description: "Subnet Address Prefix - example: 10.10.1.0/24"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:

  terraform:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: VnetBuild

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="resource_group_name=${{ inputs.resource_group_name }}" \
            -var="location=${{ inputs.location }}" \
            -var="vnet_name=${{ inputs.vnet_name }}" \
            -var="vnet_address_space=${{ inputs.vnet_address_space }}" \
            -var="subnet_name=${{ inputs.subnet_name }}" \
            -var="subnet_address_prefix=${{ inputs.subnet_address_prefix }}" \
            -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
