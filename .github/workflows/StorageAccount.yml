name: Terraform - Create Storage Account

on:
  workflow_dispatch:
    inputs:

      resource_group_name:
        description: "Resource Group Name"
        required: true
        type: string

      storage_account_name:
        description: "Storage Account Name"
        required: true
        type: string

      replication_type:
        description: "Replication Type"
        required: true
        default: "LRS"
        type: choice
        options:
          - LRS
          - ZRS
          - GRS
          - GZRS

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: StorageAccount

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="resource_group_name=${{ inputs.resource_group_name }}" \
            -var="storage_account_name=${{ inputs.storage_account_name }}" \
            -var="replication_type=${{ inputs.replication_type }}" \
            -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
