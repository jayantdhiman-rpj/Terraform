name: Terraform - Create Azure Managed Disk

on:
  workflow_dispatch:
    inputs:

      resource_group_name:
        description: "Resource Group Name"
        required: true
        type: string

      
      disk_name:
        description: "Disk Name"
        required: true
        type: string

      disk_size_gb:
        description: "Disk size in GB"
        required: true
        type: number

      storage_account_type:
	    description: "Storage Account:
		required: true
		type: string

permissions:
  id-token: write
  contents: read

jobs:

  terraform:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Disk

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="resource_group_name=${{ inputs.resource_group_name }}" \
            -var="disk_name=${{ inputs.disk_name }}" \
            -var="disk_size_gb=${{ inputs.disk_size_gb }}" \
            -var="storage_account_type=${{ inputs.storage_account_type }}" \
            -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
